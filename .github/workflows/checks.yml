name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Skipped in vaults created from the template.
    if: github.event.repository.is_template == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
